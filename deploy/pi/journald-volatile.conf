# The /var/log half of Phase 6. Install to:
#   /etc/systemd/journald.conf.d/room-display.conf
#
# PLAN.md §9 called for log2ram. This is journald's own equivalent and needs no
# third-party apt repo on a box that installs updates unattended in Phase 8 --
# one less supply chain pointed at a machine you cannot rescue with a keyboard.
#
# The trade: the journal lives in /run (RAM) and does not survive a reboot.
# `journalctl --user -u display-agent -f` still works, and so does reading logs
# from the current boot; what you lose is post-mortem after an unattended
# reboot. If that history is worth the writes, delete this file and install
# log2ram instead, which keeps logs in RAM but syncs them back hourly and on
# clean shutdown.

[Journal]
Storage=volatile
RuntimeMaxUse=32M
