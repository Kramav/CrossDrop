# Copy to targets.toml (git-ignored — it holds bearer tokens) beside this file,
# or point ROOMCTL_TARGETS at it. One [section] per display.

default = "study"            # used when --target is omitted

[study]
url = "http://100.x.y.z:8080"   # the Pi's tailnet address; `tailscale ip -4` on it
token = "<the token from /etc/room-display/config.toml on that Pi>"

# A second Pi, e.g. the spare you test release tags on:
# [spare]
# url = "http://100.a.b.c:8080"
# token = "..."
