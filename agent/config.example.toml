# Copy to config.toml (git-ignored). On the Pi this lives at
# /etc/crossdrop/config.toml and is pointed at with CROSSDROP_CONFIG.

# NOT the token. That lives on its own, in /etc/crossdrop/token (root:<user>
# 0640) -- so that editing the screen layout can never damage the credential,
# which is exactly how a token got truncated once and presented as "my token
# stopped working" with a file that looked perfectly fine. A `token = ` still
# sitting here is honoured and named in the log, so an un-migrated box keeps
# working; re-run setup.sh to move it.
#
# This file holds no secret and is readable (0644). It stays root-owned, because
# readable and writable are different questions: `path` below is what the agent
# execs, and an API that can install extensions must not also pick the binary.
home_url = "/home"           # page the kiosk opens on launch. http, https,
                             # "about:blank" (a white screen), or a path -- a
                             # path is this agent's own page and is resolved
                             # against [server] below, so "/home" becomes
                             # http://127.0.0.1:8080/home. Anything else is
                             # refused at startup rather than handed to the
                             # browser as-is.
                             #
                             # On the Pi write the full tailnet url,
                             # e.g. http://100.x.y.z:8080/home -- its systemd
                             # unit passes --host "$(tailscale ip -4)" and never
                             # reads [server], so the resolved 127.0.0.1 form
                             # would point at a port nothing is listening on.

# One [[screen]] per monitor -- but you probably don't need any. Omit the lot and
# the agent reads `xrandr --listmonitors` and makes one screen per connected
# output, named after the connector ("HDMI-1"). Nothing detected -- Windows, or no
# X session -- and you get a single screen named "main", which is what every
# single-monitor config already does. Write blocks only to override: better
# names, or a per-screen home_url.
#
# `position` is the window's x,y in the session's coordinate space -- take it
# from the "Position:" line of `wlr-randr`, not from a monitor's resolution.
# Outputs sit edge to edge, so a 1366-wide first screen puts the second at
# "1366,0". The FIRST screen lands wherever the
# compositor puts the kiosk window; positions only steer screens 2 and up.
# Wayland ignores client positioning, so multi-screen forces Chromium under
# XWayland. See deploy/pi/README.md before relying on it.
#
# `size` is cosmetic *for a screen that ends up fullscreen* -- the window is only
# briefly visible between being moved and being fullscreened, and matching it to
# the monitor avoids a small-window flash at boot. Omit it and you get 800x600
# for that moment.
#
# It stops being cosmetic with `fullscreen = false`, which is how you hand a
# screen half a panel: the size it is given is the size it keeps. A block with
# `fullscreen = false` and no position or size falls back to fullscreen with a
# warning, because an 800x600 window in the corner of a wall-mounted panel reads
# as broken.
#
# You rarely want to write this by hand -- the web UI's split control derives the
# halves from xrandr, which is how they stay correct when a monitor changes. Do
# it here only for a geometry halves cannot express (thirds, 70/30).
#
# [[screen]]
# name = "left"
# position = "0,0"
# size = "1366x768"
# home_url = ""              # empty = the top-level home_url above
#
# [[screen]]
# name = "right"
# position = "1366,0"
# size = "2560x1440"

# Where `python -m agent serve` binds. Optional -- these are the defaults. The
# Pi does not use this: its systemd unit passes --host "$(tailscale ip -4)"
# because a re-auth changes the address. Never 0.0.0.0 (PLAN.md §10).
#
# [server]
# host = "127.0.0.1"
# port = 8080

[browser]
kind = "firefox"             # "firefox" (WebDriver BiDi) | "edge" | "chromium" (CDP)
                             # firefox drives ONE window and supports navigate
                             # only -- scroll, autoscroll, media and screens 2+
                             # all 501. /v1/status reports this as `supports`.
path = ""                    # optional absolute path; empty = auto-detect
mode = "kiosk"               # "kiosk" | "fullscreen"
                             # kiosk: no browser UI and no way out of it -- the
                             # wall-mounted case, and the default.
                             # fullscreen: a fullscreen *window*. F11 and
                             # alt-tab still work, so the box stays usable as a
                             # desktop with the display running on it. Required
                             # to split a monitor: a kiosk window is entitled to
                             # refuse half-screen bounds.
                             # The seed only. The web UI can change this, and
                             # once it has, settings.json wins -- it is one of
                             # the two keys the API may write (settings.py
                             # SAFE_KEYS). Set the seed with setup.sh MODE=.
                             # Either way the browser must be relaunched, since
                             # this is a command-line flag: POST /v1/relaunch,
                             # or `roomctl relaunch`.
                             # On firefox `fullscreen` means plain windowed:
                             # there is no such switch, and /v1/window is CDP-only.
profile_dir = ""             # empty = ./profile next to this config
autolaunch = true            # false = drive a browser you started yourself
debug_port = 9222            # 127.0.0.1 only. Debug port == full browser control.
disk_cache_mb = 100          # On the Pi the profile is tmpfs, so this is RAM.
                             # Uncapped, Chromium fills /run/user/<uid>. Lower on a 2 GB Pi.
# Which extensions POST /v1/extensions may install. Empty or absent = any valid
# Web Store id, which is how this shipped and stays the default: a list nobody
# set must not stop a working display adding an ad blocker.
#
# Worth setting on a box that matters. An extension is unpacked into the profile
# holding every session this kiosk is logged in to, so it can read them all --
# this is the only route here that writes executable code onto the box, and the
# only other check is that the id is 32 characters of a-p, which a mistyped or
# squatted id also satisfies. File-only and needs a restart, like [interact]:
# an allowlist the API can add to for itself is not an allowlist.
#
# allow_extensions = ["ddkjiahejlhfcafbddmgiahcphecmpfh"]   # uBlock Origin Lite

extensions_dir = ""          # chromium/edge only. Every child directory of this
                             # holding a manifest.json is loaded unpacked. The
                             # agent installs into it (/v1/extensions, or the
                             # web UI's Settings panel), so this is the only
                             # extension setting you ever edit by hand. Keep it
                             # outside profile_dir: that is tmpfs, empty every
                             # boot. deploy/pi/README.md §10.

# Display power. Both keys are optional -- these are the defaults, and the point
# is that a working install needs none of this written down. X11 only; on Wayland
# the agent leaves the monitors alone. `0` disables that timer.
#
# `splits` is not written here: it is one of the two keys the API owns, so the
# web UI's split control writes it to settings.json. {"HDMI-1": "lr"} cuts that
# monitor into two screens side by side; "tb" stacks them. Needs
# browser.mode = "fullscreen"; in kiosk mode the splits are dropped with a
# warning and the monitors come up whole.
#
# [display]
# idle_off_minutes = 10        # sitting on its home page
# content_off_minutes = 120    # showing a site, no navigate/scroll/upload since
# restore_within_minutes = 720 # on start, put back what each screen was showing
                               # if it was last used inside this window; older
                               # than that and it comes up on home_url instead.
                               # 0 = always home. This is what makes the nightly
                               # restart (deploy/pi/crossdrop-restart.timer)
                               # invisible: the chart you left up is still up.

# POST /v1/input -- click, drag, type, press keys. OFF unless you turn it on.
#
# It exists for the one failure a keyboard-less box cannot recover from: an
# expired SSO login or a consent wall is a page nobody can get past, and the
# whole point of this display is that nobody has to be in the room. Everything
# it sends goes into the kiosk browser's own renderer over the same CDP
# connection navigate uses -- it cannot reach the window manager, the desktop,
# or any other application on the box.
#
# It ships off because it is the only route here that acts *as* whoever the
# kiosk is logged in as. Everything else shows something or reads something
# back. Turned off, `input` is absent from /v1/status `supports` and the route
# 501s, so a client hides the feature rather than discovering it by failing.
#
# This lives here and not in settings.json deliberately: on the Pi this file is
# root:<user> 640 and the agent cannot write it. A switch the API can turn on
# for itself is not a switch. Changing it needs a restart.
#
# [interact]
# enabled = false
# max_actions = 40        # per request; a login is five
# deadline_ms = 30000     # whole request. A caller may ask for less, never more

[upload]
dir = ""                     # empty = ./uploads next to this config.
                             # On the Pi point this at tmpfs — i.e. RAM, hence the caps.
max_mb = 25                  # rejected with 413 past this
keep = 5                     # newest N kept; older uploads are swept on each new one.
                             # keep * max_mb is the worst-case RAM this costs, and it
                             # shares /run/user with the browser profile + its disk
                             # cache. logind sizes that at 10% of RAM — ~400 MB on a
                             # 4 GB Pi — so the old keep = 20 could ask for 500 MB of
                             # uploads alone. Below 1 is treated as 1: the file just
                             # uploaded has to outlive the sweep for the kiosk to
                             # fetch it.
