# Copy to config.toml (git-ignored). On the Pi this lives at
# /etc/room-display/config.toml and is pointed at with ROOM_CONFIG.

token = "change-me"          # bearer token for every /v1 route
home_url = "/home"           # page the kiosk opens on launch. "/home" is the
                             # agent's own idle screen; on the Pi make it the
                             # full tailnet url, e.g. http://100.x.y.z:8080/home
                             # ("about:blank" is still valid — a white screen.)

# One [[screen]] per monitor -- but you probably don't need any. Omit the lot and
# the agent reads `xrandr --listmonitors` and makes one screen per connected
# output, named after the connector ("HDMI-1"). Nothing detected -- Windows, or no
# X session -- and you get a single screen named "main", which is what every
# single-monitor config already does. Write blocks only to override: better
# names, or a per-screen home_url.
#
# `position` is the window's x,y in the session's coordinate space -- take it
# from the "Position:" line of `wlr-randr`, not from a monitor's resolution.
# Outputs sit edge to edge, so a 1366-wide first screen puts the second at
# "1366,0". The FIRST screen lands wherever the
# compositor puts the kiosk window; positions only steer screens 2 and up.
# Wayland ignores client positioning, so multi-screen forces Chromium under
# XWayland. See deploy/pi/README.md before relying on it.
#
# `size` is cosmetic: the window is briefly visible between being moved and being
# fullscreened, and matching it to the monitor avoids a small-window flash at
# every boot. Omit it and you get 800x600 for that moment. Fullscreen wins either
# way, so a wrong size costs you nothing but the flash.
#
# [[screen]]
# name = "left"
# position = "0,0"
# size = "1366x768"
# home_url = ""              # empty = the top-level home_url above
#
# [[screen]]
# name = "right"
# position = "1366,0"
# size = "2560x1440"

# Where `python -m agent serve` binds. Optional -- these are the defaults. The
# Pi does not use this: its systemd unit passes --host "$(tailscale ip -4)"
# because a re-auth changes the address. Never 0.0.0.0 (PLAN.md §10).
#
# [server]
# host = "127.0.0.1"
# port = 8080

[browser]
kind = "firefox"             # "firefox" (WebDriver BiDi) | "edge" | "chromium" (CDP)
                             # firefox drives ONE window and supports navigate
                             # only -- scroll, autoscroll, media and screens 2+
                             # all 501. /v1/status reports this as `supports`.
path = ""                    # optional absolute path; empty = auto-detect
profile_dir = ""             # empty = ./profile next to this config
autolaunch = true            # false = drive a browser you started yourself
debug_port = 9222            # 127.0.0.1 only. Debug port == full browser control.
disk_cache_mb = 100          # On the Pi the profile is tmpfs, so this is RAM.
                             # Uncapped, Chromium fills /run/user/<uid>. Lower on a 2 GB Pi.

# Display power. Both keys are optional -- these are the defaults, and the point
# is that a working install needs none of this written down. X11 only; on Wayland
# the agent leaves the monitors alone. `0` disables that timer.
#
# [display]
# idle_off_minutes = 10        # sitting on its home page
# content_off_minutes = 120    # showing a site, no navigate/scroll/upload since
# restore_within_minutes = 720 # on start, put back what each screen was showing
                               # if it was last used inside this window; older
                               # than that and it comes up on home_url instead.
                               # 0 = always home. This is what makes the nightly
                               # restart (deploy/pi/room-display-restart.timer)
                               # invisible: the chart you left up is still up.

[upload]
dir = ""                     # empty = ./uploads next to this config.
                             # On the Pi point this at tmpfs — i.e. RAM, hence the caps.
max_mb = 25                  # rejected with 413 past this
keep = 5                     # newest N kept; older uploads are swept on each new one.
                             # keep * max_mb is the worst-case RAM this costs, and it
                             # shares /run/user with the browser profile + its disk
                             # cache. logind sizes that at 10% of RAM — ~400 MB on a
                             # 4 GB Pi — so the old keep = 20 could ask for 500 MB of
                             # uploads alone. Below 1 is treated as 1: the file just
                             # uploaded has to outlive the sweep for the kiosk to
                             # fetch it.
