<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room display</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 22%, transparent); }
  * { box-sizing: border-box; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto;
         padding: 0 1rem 3rem; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  fieldset { border: 1px solid var(--line); border-radius: .6rem; padding: .8rem;
             margin: 0 0 1rem; }
  legend { padding: 0 .4rem; font-size: .8rem; text-transform: uppercase;
           letter-spacing: .08em; opacity: .65; }

  /* screen picker */
  #screens { display: flex; flex-wrap: wrap; gap: .4rem; }
  #screens button { flex: 1; min-width: 7rem; border: 1px solid var(--line);
                    background: transparent; border-radius: .4rem; padding: .5rem;
                    text-align: left; line-height: 1.25; }
  #screens button[aria-pressed=true] { border-color: currentColor;
    background: color-mix(in srgb, currentColor 12%, transparent); font-weight: 600; }
  #screens .where { display: block; font-size: .78rem; font-weight: 400; opacity: .6;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #drop { border: 2px dashed currentColor; border-radius: .5rem; padding: 2.5rem 1rem;
          text-align: center; opacity: .6; }
  #drop.over { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }
  #drop label { text-decoration: underline; cursor: pointer; }
  #drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

  form { display: flex; gap: .5rem; margin: 1rem 0; }
  input[type=url] { flex: 1; min-width: 0; padding: .5rem; font: inherit; }
  button { padding: .5rem .9rem; font: inherit; cursor: pointer; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .row.tight { gap: .3rem; }
  #saved { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; list-style: none; }
  #saved button { max-width: 16rem; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
  #saved .x { padding: .5rem; }
  #auto[aria-pressed=true], #mute[aria-pressed=true] {
    background: color-mix(in srgb, currentColor 20%, transparent); font-weight: 600; }
  #pos { font: .85rem ui-monospace, monospace; opacity: .7; }
  #status { opacity: .7; word-break: break-all; min-height: 1.5em; }
  kbd { font: .8em ui-monospace, monospace; border: 1px solid var(--line);
        border-bottom-width: 2px; border-radius: .3rem; padding: 0 .3em; }

  /* settings */
  details { border: 1px solid var(--line); border-radius: .6rem; padding: .8rem; }
  summary { cursor: pointer; font-size: .8rem; text-transform: uppercase;
            letter-spacing: .08em; opacity: .65; }
  details[open] summary { margin-bottom: .8rem; }
  details h2 { font-size: .95rem; margin: 1.2rem 0 .5rem; }
  details label { display: block; font-size: .78rem; opacity: .7; }
  details input { width: 100%; padding: .4rem; font: inherit; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .6rem;
          margin-bottom: .8rem; }
  .grid .wide { grid-column: 1 / -1; }
  .note { font-size: .8rem; opacity: .7; margin: .4rem 0 0; }
  footer { margin-top: 2rem; font-size: .78rem; opacity: .5;
           display: flex; gap: .6rem; flex-wrap: wrap; }
</style>

<h1>Room display</h1>

<fieldset>
  <legend>Send to</legend>
  <div id="screens"></div>
</fieldset>

<div id="drop">
  Drop or paste a link or file here, or
  <!-- drag-and-drop is mouse-only; the picker is the keyboard path -->
  <label>
    <input type="file" id="pick"
           accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.mp4,.webm,.mp3,.m4a,.wav">
    choose a file
  </label>
</div>

<form id="go">
  <label for="url" class="sr-only" hidden>URL</label>
  <input id="url" type="url" placeholder="https://…" required>
  <button>Show</button>
  <button type="button" id="save" title="Save this link as a button">★</button>
</form>

<ul id="saved"></ul>

<!-- Hidden until the screen actually has a video or audio element on it, so the
     controls appear by themselves the moment someone puts a video on the wall. -->
<fieldset id="media" hidden>
  <legend id="media-legend">Playing</legend>
  <div class="row tight">
    <button type="button" id="back" title="Back 10 seconds (←)">⏪</button>
    <button type="button" id="playpause" title="Play / pause (Space)">▶</button>
    <button type="button" id="fwd" title="Forward 10 seconds (→)">⏩</button>
    <button type="button" id="mute" aria-pressed="false" title="Mute">🔇</button>
    <label>volume <input id="vol" type="range" min="0" max="100" value="100"></label>
    <span id="pos"></span>
  </div>
</fieldset>

<fieldset id="scroll-box">
  <legend id="scroll-legend">Scroll</legend>
  <div class="row tight">
    <button type="button" id="top" title="Jump to top">⤒</button>
    <button type="button" id="up" title="Up a screenful">▲</button>
    <button type="button" id="down" title="Down a screenful">▼</button>
    <button type="button" id="bottom" title="Jump to bottom">⤓</button>
    <button type="button" id="auto" aria-pressed="false"
            title="Scroll slowly and continuously">Auto-scroll</button>
    <label>speed <input id="speed" type="range" min="10" max="120" value="40"></label>
  </div>
  <p style="margin:.6rem 0 0;font-size:.85rem;opacity:.65">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>PgUp</kbd> <kbd>PgDn</kbd> <kbd>Home</kbd>
    <kbd>End</kbd> work here too, unless you're typing in the box.
  </p>
</fieldset>

<div class="row">
  <button type="button" id="home">Home</button>
  <button type="button" id="reload">Reload</button>
  <!-- Both monitors together: X11 has no per-output power. agent/display.py -->
  <button type="button" id="power">Display off</button>
</div>

<p id="status" role="status" aria-live="polite">…</p>

<!-- Why a control you expected isn't here. Hidden unless the agent's browser
     actually withholds something — see `supports` in /v1/status. -->
<p id="cap" hidden style="opacity:.65;font-size:.85rem"></p>

<details id="setup">
  <summary>Settings</summary>

  <label for="tok">Agent token — from <code>config.toml</code> on the Pi</label>
  <div class="row tight">
    <input id="tok" type="password" autocomplete="off" style="flex:1">
    <button type="button" id="savetok">Save</button>
  </div>
  <p class="note">Kept in this browser only, never sent anywhere but the agent.</p>

  <h2>Screens</h2>
  <div id="screencfg"></div>
  <div class="row tight">
    <button type="button" id="savecfg">Save screens</button>
    <button type="button" id="redetect" title="Clear position and size so xrandr wins again">
      Re-detect layout</button>
  </div>
  <p class="note" id="cfgnote"></p>
</details>

<footer><span id="ver"></span><span id="host"></span></footer>

<script>
const $ = s => document.querySelector(s);
const store = { // ponytail: saved links live in this browser only; move to the agent
  get: () => JSON.parse(localStorage.saved || "[]"),
  set: v => localStorage.saved = JSON.stringify(v),
};

// Always a real screen name once we've talked to the agent, never "". Letting
// it stay empty meant every button silently acted on the first screen with
// nothing in the UI saying so — which reads as "scroll is broken on that
// monitor" rather than "you didn't pick it".
let screens = [];
let target = localStorage.screen || "";
let awake = true;
let media = null;                  // last known playback state, or null: nothing playing

// What this agent's browser can actually do, from /v1/status. Firefox does
// navigate and nothing else, so offering it a Scroll button is offering a 501.
// null = an agent too old to say, in which case assume everything: that is
// exactly how this page behaved before `supports` existed.
let supports = null;
const can = f => !supports || supports.has(f);

// No prompt(): a popup you can't paste into comfortably, can't correct without
// clearing site data, and which says nothing useful when the token is wrong.
function auth() { return { Authorization: "Bearer " + (localStorage.token || "") }; }

// Open Settings and point at the token box. Called on first run and on any 401,
// so a rejected token always lands you where you fix it.
function askToken(why) {
  $("#setup").open = true;
  $("#tok").focus();
  $("#status").textContent = why;
}

async function req(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) {
    delete localStorage.token;
    askToken("token rejected — paste it again");
    throw new Error("bad token");
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

// Every action carries the selected screen. Omitted server-side = first screen.
async function api(path, body) {
  return req(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...auth() },
    body: JSON.stringify({ screen: target || undefined, ...body }),
  });
}

async function act(fn) {
  $("#status").textContent = "…";
  try { await fn(); $("#status").textContent = ""; }
  catch (e) { $("#status").textContent = "✗ " + e.message; }
  refresh();
}

const show = url => act(() => api("/v1/navigate", { url }));

function send(file) {
  return act(async () => {
    $("#status").textContent = "uploading " + file.name + "…";
    const body = new FormData();
    body.append("file", file);
    if (target) body.append("screen", target);
    await req("/v1/upload", { method: "POST", body, headers: auth() });
  });
}

// Hide what this browser will only 501 on, and say so once rather than letting
// the controls just be mysteriously absent.
function drawCapabilities(kind) {
  for (const id of ["#top", "#up", "#down", "#bottom"]) $(id).hidden = !can("scroll");
  $("#auto").hidden = !can("autoscroll");
  // #speed is not hidden with it: page() reads that slider for the scroll step
  // size too, so it belongs to whichever of the two survives.
  $("#scroll-box").hidden = !can("scroll") && !can("autoscroll");

  const missing = ["scroll", "autoscroll", "media", "screens"].filter(f => !can(f));
  $("#cap").hidden = !missing.length;
  $("#cap").textContent = missing.length
    ? `this display runs ${kind}, so ${missing.join(", ")} are unavailable `
      + "— they need chromium or edge"
    : "";
}

function drawScreens() {
  // One monitor: the picker is noise. Hide the whole fieldset. So is a picker
  // on a browser that can only ever drive the first screen.
  $("#screens").closest("fieldset").hidden = screens.length < 2 || !can("screens");
  // Name the armed screen on the controls too, so it is never a guess.
  $("#scroll-legend").textContent =
    screens.length > 1 && target ? `Scroll — ${target}` : "Scroll";
  const all = [...screens, { name: "all", current_url: "every screen" }];
  $("#screens").replaceChildren(...all.map(s => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(target === s.name));
    const where = document.createElement("span");
    where.className = "where";
    where.textContent = s.name === "all" ? "every screen"
      : (s.current_url || "—").replace(/^https?:\/\//, "");
    // Label only. "all" is the wire value the agent matches on — see targets().
    const label = s.name === "all" ? "All" : s.name;
    b.append(label + (s.autoscroll ? " ⏬" : ""), where);
    b.onclick = () => { target = localStorage.screen = s.name; drawScreens(); };
    return b;
  }));
}

async function refresh() {
  try {
    const s = await req("/v1/status", { headers: auth() });
    supports = s.supports ? new Set(s.supports) : null;
    drawCapabilities(s.kind || "this browser");
    screens = s.screens || [];
    // Pin the selection to a real screen: first run, or a screen that has since
    // been renamed out of the config.
    // A browser that can't address screens gets pinned to the first one too: a
    // "right" left in localStorage would aim every click at a 501.
    const stale = can("screens")
      ? target !== "all" && !screens.some(x => x.name === target)
      : target !== (screens[0] || {}).name;
    if (stale) {
      target = screens.length ? screens[0].name : "";
      if (target) localStorage.screen = target;
    }
    const me = screens.find(x => x.name === target);
    // A dark display is the one state the page can't show by naming a url, and
    // the one most likely to be mistaken for "the Pi is broken".
    awake = s.awake !== false;
    $("#power").textContent = awake ? "Display off" : "Wake display";
    if (!$("#status").textContent) {
      $("#status").textContent = !awake ? "display asleep — anything you send wakes it"
        : s.browser === "ok"
        ? (target === "all" ? "all screens"
           : me ? `${me.name}: ${me.current_url || "—"}` : s.current_url)
        : "browser down";
    }
    $("#auto").setAttribute("aria-pressed", String(!!(me && me.autoscroll)));
    probeMedia();                    // not awaited: the rest of the page is ready

    $("#ver").textContent = s.version;
    $("#host").textContent = location.host;
    drawScreens();
  } catch (e) { $("#status").textContent = "✗ " + e.message; }
}

// --- playback ---------------------------------------------------------------

const clock = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function drawMedia(m) {
  media = m;
  $("#media").hidden = !m;
  if (!m) return;
  $("#playpause").textContent = m.playing ? "⏸" : "▶";
  $("#mute").setAttribute("aria-pressed", String(m.muted));
  $("#vol").value = m.volume;
  $("#pos").textContent = m.duration
    ? `${clock(m.position)} / ${clock(m.duration)}` : clock(m.position);
  $("#media-legend").textContent =
    screens.length > 1 && target ? `Playing — ${target}` : "Playing";
}

// Any failure hides the controls: 404 is "no video on this page", and anything
// else means we can't drive it either. Deliberately quiet — this runs on a timer.
// Not even asked for on a browser that can't answer: a 501 every 15s reads as
// "nothing playing", which is indistinguishable from the truth and costs a
// round-trip to learn nothing.
const probeMedia = () => can("media")
  ? api("/v1/media", { action: "state" }).then(drawMedia, () => drawMedia(null))
  : drawMedia(null);

const mediaAct = (action, value) =>
  act(() => api("/v1/media", { action, value }).then(drawMedia));

$("#playpause").onclick = () => mediaAct("toggle");
$("#back").onclick = () => mediaAct("seek", -10);
$("#fwd").onclick = () => mediaAct("seek", 10);
$("#mute").onclick = () => mediaAct(media && media.muted ? "unmute" : "mute");
// onchange, not oninput: a drag would otherwise fire a request per pixel.
$("#vol").onchange = () => mediaAct("volume", Number($("#vol").value));

function drawSaved() {
  $("#saved").replaceChildren(...store.get().map(url => {
    const li = document.createElement("li");
    const go = document.createElement("button");
    go.textContent = url.replace(/^https?:\/\//, "");
    go.title = url;
    go.onclick = () => show(url);
    const del = document.createElement("button");
    del.textContent = "×";
    del.className = "x";
    del.title = "Forget " + url;
    del.onclick = () => { store.set(store.get().filter(u => u !== url)); drawSaved(); };
    li.append(go, del);
    return li;
  }));
}

$("#go").onsubmit = e => { e.preventDefault(); show($("#url").value); };
$("#save").onclick = () => {
  const url = $("#url").value;
  if (url && !store.get().includes(url)) { store.set([...store.get(), url]); drawSaved(); }
};
$("#home").onclick = () => act(() => api("/v1/home"));
$("#reload").onclick = () => act(() => api("/v1/reload"));
// Not api(): /v1/display takes no screen — the monitors sleep together.
$("#power").onclick = () => act(() => req("/v1/display", {
  method: "POST",
  headers: { "Content-Type": "application/json", ...auth() },
  body: JSON.stringify({ action: awake ? "off" : "on" }),
}));

// Guarded here rather than at each caller: this covers the four buttons and the
// six keyboard bindings, and a key still works while the buttons are hidden.
const scroll = body => can("scroll") && act(() => api("/v1/scroll", body));
const page = () => Number($("#speed").value) * 15;   // a screenful-ish per press
$("#up").onclick = () => scroll({ dy: -page() });
$("#down").onclick = () => scroll({ dy: page() });
$("#top").onclick = () => scroll({ to: "top" });
$("#bottom").onclick = () => scroll({ to: "bottom" });
$("#auto").onclick = () => {
  const on = $("#auto").getAttribute("aria-pressed") === "true";
  act(() => api("/v1/autoscroll", {
    action: on ? "stop" : "start", speed: Number($("#speed").value),
  }));
};

// Keyboard control, the third scroll mode. Ignored while typing, so the URL box
// still behaves like a URL box.
const KEYS = {
  ArrowDown: () => scroll({ dy: 120 }), ArrowUp: () => scroll({ dy: -120 }),
  PageDown: () => scroll({ dy: page() }), PageUp: () => scroll({ dy: -page() }),
  Home: () => scroll({ to: "top" }), End: () => scroll({ to: "bottom" }),
  // The transport keys, and no-ops when nothing is playing.
  " ": () => media && mediaAct("toggle"),
  ArrowLeft: () => media && mediaAct("seek", -10),
  ArrowRight: () => media && mediaAct("seek", 10),
};
document.onkeydown = e => {
  if (e.target.matches("input, textarea") || e.ctrlKey || e.altKey || e.metaKey) return;
  const fn = KEYS[e.key];
  if (fn) { e.preventDefault(); fn(); }
};

$("#pick").onchange = e => e.target.files[0] && send(e.target.files[0]);

// --- settings ---------------------------------------------------------------
// Everything here is a *runtime* setting the agent owns. The token, the browser
// kind and the install paths stay in config.toml on the Pi — see PLAN.md §7.

function field(label, value, placeholder) {
  const wrap = document.createElement("label");
  wrap.textContent = label;
  const i = document.createElement("input");
  Object.assign(i, { value: value || "", placeholder: placeholder || "" });
  wrap.append(i);
  return wrap;
}

function drawSettings(cfg) {
  $("#screencfg").replaceChildren(...cfg.screens.map(s => {
    const g = document.createElement("div");
    g.className = "grid";
    const name = field("Name", s.name);
    const home = field("Home URL", s.home_url);
    home.className = "wide";
    // Placeholder, not value: blank means "use what xrandr detected", so the
    // detected geometry has to show as the fallback rather than as an edit.
    const pos = field("Position", s.position, s.detected_position || "e.g. 1366,0");
    const size = field("Size", s.size, s.detected_size || "e.g. 2560x1440");
    g.append(name, home, pos, size);
    return g;
  }));
  $("#cfgnote").textContent = cfg.note || "Saved on the Pi at " + cfg.path;
}

function readSettings() {
  return [...$("#screencfg").children].map(g => {
    const [name, home, position, size] = [...g.querySelectorAll("input")].map(i => i.value);
    return { name, home_url: home, position, size };
  });
}

async function loadSettings() {
  try { drawSettings(await req("/v1/settings", { headers: auth() })); }
  catch (e) { $("#cfgnote").textContent = "✗ " + e.message; }
}

async function saveSettings(screens) {
  $("#cfgnote").textContent = "saving…";
  try {
    drawSettings(await req("/v1/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json", ...auth() },
      body: JSON.stringify({ screens }),
    }));
    refresh();                       // names may have changed; redraw the picker
  } catch (e) { $("#cfgnote").textContent = "✗ " + e.message; }
}

$("#savetok").onclick = () => {
  localStorage.token = $("#tok").value.trim();
  $("#status").textContent = "";
  loadSettings();
  refresh();
};
$("#tok").onkeydown = e => { if (e.key === "Enter") $("#savetok").click(); };
$("#savecfg").onclick = () => saveSettings(readSettings());
// Blank position and size and the agent falls back to xrandr — that is the
// reset, so re-detect is just a save with those two fields empty.
$("#redetect").onclick = () =>
  saveSettings(readSettings().map(s => ({ ...s, position: "", size: "" })));
// Fetch on first open only: the editor is not something to poll.
$("#setup").addEventListener("toggle", function once() {
  if (!$("#setup").open) return;
  $("#setup").removeEventListener("toggle", once);
  loadSettings();
});

const drop = $("#drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => {
  e.preventDefault();
  drop.classList.remove("over");
  // ponytail: one file per drop — a display shows one thing at a time.
  if (e.dataTransfer.files.length) { send(e.dataTransfer.files[0]); return; }
  const url = (e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text")).trim();
  if (url) show(url.split("\n")[0]);
};
document.onpaste = e => {
  if (document.activeElement === $("#url")) return;
  if (e.clipboardData.files.length) { send(e.clipboardData.files[0]); return; }
  const url = e.clipboardData.getData("text").trim();
  if (url) show(url);
};

drawSaved();
if (localStorage.token) refresh();
else askToken("paste the agent token below to get started");
setInterval(refresh, 15000);
</script>
