<!doctype html>
<meta charset="utf-8">
<title>Stream</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #video { display: block; width: 100%; height: 100%; object-fit: contain; }
  #note { position: fixed; inset: 0; margin: 0; display: grid; place-items: center;
          color: #9aa0aa; font: 2rem system-ui, sans-serif; }
  #note[hidden] { display: none; }
</style>
<!-- The kiosk side of /v1/stream. Opened by the agent with a one-time id; plays
     whatever the PC sends and goes back to what the screen showed before when
     the PC stops. Not muted: the kiosk runs with
     --autoplay-policy=no-user-gesture-required, so sound starts by itself. -->
<video id="video" autoplay playsinline></video>
<p id="note">Waiting for the PC…</p>
<script>
const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get("id") || "";
const GRACE_MS = 5000;          // "disconnected" can recover; give it this long
const CONNECT_MS = 20000;       // answered, but the PC never got through
let back = "/home";             // until the offer says where we came from
let leaving = false;

function leave() {
  if (leaving) return;
  leaving = true;
  location.replace(back);
}

// Wait for every address to be gathered, so one answer carries them all and no
// candidate has to be trickled. Capped: an interface that never finishes must
// not hold the stream up.
function gathered(pc, ms = 3000) {
  return new Promise(done => {
    if (pc.iceGatheringState === "complete") return done();
    const t = setTimeout(done, ms);
    pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") { clearTimeout(t); done(); }
    });
  });
}

// Keeps the display awake while something is playing; see /stream-alive.
function tick() {
  fetch("/stream-alive?id=" + encodeURIComponent(id)).catch(() => {});
}

async function main() {
  const r = await fetch("/stream-offer?id=" + encodeURIComponent(id));
  // Already used, or from before a restart: nothing to show.
  if (!r.ok) { leave(); return; }
  const offer = await r.json();
  back = offer.back || back;

  const pc = new RTCPeerConnection();
  const media = new MediaStream();
  pc.ontrack = e => { media.addTrack(e.track); $("#video").srcObject = media; };
  $("#video").onplaying = () => { $("#note").hidden = true; };
  let timer = setTimeout(() => {
    $("#note").textContent = "Couldn't connect to the PC";
    setTimeout(leave, GRACE_MS);
  }, CONNECT_MS);
  pc.onconnectionstatechange = () => {
    const state = pc.connectionState;
    clearTimeout(timer);
    if (state === "disconnected") timer = setTimeout(leave, GRACE_MS);
    else if (state === "failed" || state === "closed") leave();
  };

  await pc.setRemoteDescription({ type: "offer", sdp: offer.sdp });
  await pc.setLocalDescription(await pc.createAnswer());
  await gathered(pc);
  const a = await fetch("/stream-answer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, sdp: pc.localDescription.sdp }),
  });
  if (!a.ok) { leave(); return; }
  setInterval(tick, 60000);
}

main().catch(e => {
  $("#note").textContent = "Stream failed: " + e.message;
  setTimeout(leave, GRACE_MS);
});
</script>
