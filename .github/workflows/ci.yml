# PLAN.md §4 filed this under deploy/github/ci.yml, but GitHub only reads
# .github/workflows/, so it lives here or it never runs.
#
# A green run is the signal that it is safe to cut a tag -- which is what the
# Pi's update.sh then deploys. Tags are also built, so a bad tag shows up red
# here before the timer picks it up on the Pi.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib, pyproject requires-python); the newer one
        # is what a current Pi OS actually runs.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r agent/requirements.txt
      - run: pip install -e .
      # Errors only, not style: undefined names, syntax, unused imports. The
      # things that make a release fail to boot on a box with no keyboard.
      - run: pip install ruff && ruff check --select E9,F .
      # The remote-desktop boundary, mechanically. /v1/screenshot captures one
      # browser target's frame tree over CDP, so it structurally cannot see the
      # box's desktop, its other windows or its taskbar -- the limit is a
      # property of the transport rather than a rule anyone has to remember.
      # These are the ways out of it: a desktop capture API, or CDP's own
      # screencast, which is the one path to video that never leaves CDP.
      # PLAN.md v1.2.0. Delete this only with a decision behind it.
      - name: no desktop capture, no streaming
        run: |
          ! grep -rnE 'startScreencast|Page\.screencast|scrot|grim|\bmss\b|pyautogui|uinput|CopyFromScreen|import -window' \
            agent/ roomctl/ web/ deploy/
      # shellcheck over the deploy scripts. These run unattended at 04:00 on a
      # box with no keyboard, and `bash -n` only catches syntax -- not an
      # unquoted expansion or a `set -e` that will not fire inside a function.
      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/pi/*.sh
      # PowerShell had zero coverage: test_deploy.py globs *.sh, and both CI jobs
      # are linux, so roomtray.ps1 could not even fail to parse.
      - name: powershell parses
        run: |
          pwsh -NoProfile -Command '
            $bad = 0
            Get-ChildItem deploy -Recurse -Filter *.ps1 | ForEach-Object {
              $e = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$null, [ref]$e) | Out-Null
              if ($e) { $e | ForEach-Object { Write-Host $_ }; $bad = 1 }
            }
            exit $bad'
      # `python -m`, not bare `pytest`: the agent package is imported from the
      # repo root and only -m puts the working directory on sys.path.
      - run: python -m pytest -q
      # One version number. This is the only one a pip install sees; the
      # deployed one comes from the tag, and 0.1.0 sat under v1.3.0 for a while
      # with nothing to notice. Drift is now untaggable.
      - name: pyproject version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          test "$v" = "${GITHUB_REF_NAME#v}" \
            || { echo "pyproject says $v, tag says ${GITHUB_REF_NAME#v}"; exit 1; }

  # browser.py is the riskiest file in the repo and every test that speaks real
  # CDP was skipped in CI, so the protocol code was only ever exercised by hand.
  # Two comments in that file record bugs found *only* on the Pi -- inspect()
  # 503ing on chrome-error:// is the one that made update.sh's rollback gate
  # guard nothing, and it "passed against desktop Chrome every time".
  #
  # Its own job, not a matrix step: a headless kiosk is the flakiest thing here,
  # and a red X on it should read as "go and look", not block the unit suite
  # from reporting. It still gates a tag -- that is the point.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r agent/requirements.txt && pip install -e .
      # The runner already ships Google Chrome; browser._exe looks for
      # `chromium` on PATH, so one symlink beats an apt or snap install that
      # would be slower and, for chromium on Ubuntu, a snap transitional package.
      - name: chromium on PATH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          sudo ln -sf "$(command -v google-chrome)" /usr/local/bin/chromium
          # Ubuntu 24.04 AppArmor-blocks unprivileged user namespaces, which is
          # what Chromium's own sandbox is built on -- it dies at startup rather
          # than running unsandboxed. Relaxing it beats --no-sandbox: the tests
          # would then be exercising a configuration no Pi ever runs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Not a formality: the kiosk fixture *skips* when it cannot find a
          # binary, and a silent skip is indistinguishable from a pass. That is
          # how this whole gap lasted. Fail here instead, loudly.
          chromium --version
      - name: real browser over CDP
        env:
          CROSSDROP_SMOKE: '1'
          CROSSDROP_BROWSER: chromium
        run: xvfb-run -a python -m pytest -q -s tests/test_smoke.py
