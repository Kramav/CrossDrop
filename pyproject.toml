# Exists to put `roomctl` on PATH on the two controller boxes. The agent is not
# packaged — it runs from a checkout on the Pi (PLAN.md §8), so it stays out.

[project]
name = "roomctl"
# Kept in step with the git tag by a CI check on refs/tags/v*. This is the only
# version a `pip install` sees; the deployed one comes from CROSSDROP_VERSION,
# which update.sh writes from the tag. Two numbers for one thing is how 0.1.0
# came to sit under a v1.3.0 tag with nothing noticing.
#
# Not setuptools-scm: update.sh uses `git archive` deliberately, so a release
# directory has no .git at all and scm would fail at build time on the Pi --
# the box you cannot reach.
version = "2.0.0"
description = "Client for the CrossDrop display agent"
requires-python = ">=3.11"
dependencies = ["httpx"]

[project.scripts]
roomctl = "roomctl.cli:main"

[tool.setuptools]
packages = ["roomctl"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
