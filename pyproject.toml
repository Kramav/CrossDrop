# Exists to put `roomctl` on PATH on the two controller boxes. The agent is not
# packaged — it runs from a checkout on the Pi (PLAN.md §8), so it stays out.

[project]
name = "roomctl"
# What `pip show roomctl` says on a controller box, and nothing else -- no code
# reads it. The version that matters operationally is the tag: update.sh writes
# it into the release as CROSSDROP_VERSION and /v1/status reports it, so "which
# code is this Pi running" is answered by the tag alone.
#
# Deliberately NOT tied to the tag. CI used to refuse a tag whose number did not
# match this line, which meant a build could veto a judgement about what a major
# version means. Bump this when it is worth bumping; the two need not agree.
#
# Not setuptools-scm either: update.sh uses `git archive` deliberately, so a
# release directory has no .git at all and scm would fail at build time on the
# Pi -- the box you cannot reach.
version = "2.0.0"
description = "Client for the CrossDrop display agent"
requires-python = ">=3.11"
dependencies = ["httpx"]

[project.scripts]
roomctl = "roomctl.cli:main"

[tool.setuptools]
packages = ["roomctl"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
